name: Sync protocol docs

on:
  repository_dispatch:
    types: [sync-protocol-docs]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-protocol-docs
  cancel-in-progress: false

jobs:
  sync:
    name: Refresh documentation mirrors
    runs-on: ubuntu-latest
    steps:
      - name: Check sync app configuration
        env:
          APP_ID: ${{ vars.AHP_BOT_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.AHP_BOT_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::Make organization variable AHP_BOT_APP_ID and secret AHP_BOT_APP_PRIVATE_KEY available to the website repository."
            exit 1
          fi

      - name: Create website installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AHP_BOT_APP_ID }}
          private-key: ${{ secrets.AHP_BOT_APP_PRIVATE_KEY }}
          owner: agenthooksprotocol
          repositories: website
          permission-contents: write

      - name: Check out protocol sources
        uses: actions/checkout@v5
        with:
          repository: agenthooksprotocol/agent-hooks-protocol
          ref: main
          path: protocol
          persist-credentials: false

      - name: Check out website
        uses: actions/checkout@v5
        with:
          ref: main
          path: website
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Synchronize and publish docs
        working-directory: website
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          bot_login="${APP_SLUG}[bot]"
          bot_id=$(gh api "users/$bot_login" --jq .id)
          git config user.name "$bot_login"
          git config user.email "${bot_id}+${bot_login}@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            base=$(git rev-parse HEAD)
            npm ci
            npm run sync:protocol-docs -- ../protocol
            npm run build
            git add -A src/pages/docs \
              src/generated/protocol-docs.ts \
              public/protocol

            if git diff --cached --quiet; then
              echo "Protocol documentation is already up to date."
              exit 0
            fi

            git commit -m "docs: sync protocol project docs"
            if git push origin HEAD:main; then
              exit 0
            fi

            git fetch origin main
            if [[ "$(git rev-parse origin/main)" == "$base" ]]; then
              echo "::error::Website push was rejected without a concurrent main update. Check the app's repository permissions and ruleset bypass."
              exit 1
            fi
            echo "::warning::Website main changed during sync; retrying ($attempt/3)."
          done

          echo "::error::Could not push synchronized docs after 3 attempts."
          exit 1
